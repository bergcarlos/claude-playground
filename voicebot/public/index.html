<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheibentermin Voicebot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%278%27 fill=%27%23d4111f%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <section class="call" aria-label="Gespräch">
    <header class="head">
      <div class="badge" id="avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l2.2-6.2A2 2 0 0 1 7.1 7.5h9.8a2 2 0 0 1 1.9 1.3L21 15"/><path d="M3 15h18v3H3z"/><circle cx="7.5" cy="18" r="1.4"/><circle cx="16.5" cy="18" r="1.4"/></svg>
      </div>
      <div>
        <h1 id="title">Scheibentermin per Sprache</h1>
        <p id="status" class="status" aria-live="polite">Bereit</p>
      </div>
      <button id="hangup" class="ghost danger" hidden>Auflegen</button>
    </header>

    <div id="start" class="start">
      <p>Ein Anruf dauert ca. 3 Minuten. Bitte erlauben Sie den Mikrofonzugriff, wenn der Browser fragt.</p>
      <button id="startBtn" class="primary">Anruf starten</button>
      <p class="hint" id="capsHint"></p>
    </div>

    <div id="chat" class="chat" aria-live="polite" hidden></div>

    <form id="form" class="composer" hidden>
      <button type="button" id="mic" class="mic" aria-pressed="false" title="Mikrofon an/aus">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <input id="input" autocomplete="off" placeholder="…oder hier tippen" aria-label="Nachricht">
      <button class="primary" type="submit">Senden</button>
    </form>
    <p id="interim" class="interim" aria-hidden="true"></p>
  </section>

  <aside class="side" aria-label="Erfasste Daten">
    <h2>Erfasste Daten</h2>
    <dl id="fields"></dl>
    <div id="booking" class="booking" hidden></div>
    <p class="hint">Prototyp: Service Center, Termine und Buchung sind Testdaten. Es wird nichts tatsächlich gebucht.</p>
  </aside>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
